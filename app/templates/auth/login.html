{% extends "base.html" %}
{% block title %}Sign in · Campus Lost &amp; Found{% endblock %}
{% block content %}
<h1>Welcome back</h1><p>Sign in to manage your reports and claims.</p>
<form class="card" method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required value="{{ email }}">
  <label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
  <p class="muted">Need an account? <a href="{{ url_for('auth.register') }}">Register</a>.</p>
</form>
{% endblock %}
